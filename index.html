                { title: 'Seguridad y Confianza', description: 'Operamos bajo estrictas normas regulatorias.', icon: 'shield-check' },
            ],
            STATS: [

                { value: 15, suffix: '+', label: 'Universidades Aliadas' },

            ],

                { icon: 'trending-up', title: 'Inversiones Académicas', description: 'Haz crecer tu dinero con fondos de inversión diseñados para perfiles conservadores.', features: ['Desde Bs.200', 'Gestión automatizada', 'Reportes en tiempo real'] },
                { icon: 'home', title: 'Crédito para Egresados', description: 'Al graduarte, accede a créditos hipotecarios y vehiculares.', features: ['Condiciones especiales', 'Asesoría personalizada', 'Proceso rápido'] },
                { icon: 'arrow-left-right', title: 'Transferencias Internacionales', description: 'Envía y recibe dinero del exterior para tus estudios.', features: ['Múltiples divisas', 'Comisiones bajas', 'Cobertura global'] }
            ],

                { icon: 'shield-off', label: 'Sin comisiones' },
                { icon: 'fingerprint', label: 'Biometría' },
                { icon: 'zap', label: 'Pagos Móviles' },
                { icon: 'target', label: 'Metas' },

                { icon: 'message-circle', label: 'Asesor' },
                { icon: 'globe', label: 'Divisas' },

                { text: 'El crédito educativo me permitió terminar mi posgrado sin preocupaciones.', name: 'Carlos Mendoza', role: 'Docente USB', initial: 'C', stars: 5 },

                { step: '01', text: 'Descarga la app o ingresa al sitio web' },

            ],
            FOOTER_PRODUCTS: ['Cuenta Universitaria', 'Crédito Educativo', 'Ahorro Programado', 'Inversiones', 'Crédito Egresados', 'Transferencias'],
            FOOTER_INSTITUTION: ['Quiénes Somos', 'Misión y Visión', 'Equipo Directivo', 'Responsabilidad Social', 'Prensa', 'Trabaja con Nosotros'],

                { value: 'ucla', label: 'UCLA' }, { value: 'ucv', label: 'UCV' }, { value: 'usb', label: 'USB' }, { value: 'ula', label: 'ULA' }, { value: 'luz', label: 'LUZ' }, { value: 'uc', label: 'UC' }, { value: 'otra', label: 'Otra' }
            ]
        };

        const { loadModule } = window['vue3-sfc-loader'];

        window.loaderOptions = {
            moduleCache: {
                vue: Vue,
            },
            async getFile(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(res.statusText + ' ' + url);
                return await res.text();
            },
            addStyle(textContent) {
                const style = Object.assign(document.createElement('style'), { textContent });
                const ref = document.head.getElementsByTagName('style')[0] || null;
                document.head.insertBefore(style, ref);
            },
        };

        const app = Vue.createApp({
            components: {
                'app-root': Vue.defineAsyncComponent(() => loadModule('./src/App.vue', window.loaderOptions))
            },
            template: '<app-root></app-root>'
        });

        app.mount('#app');
    </script>
</body>

</html>
